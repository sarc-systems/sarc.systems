# Library vocabulary — single source of truth for templates, filters, the JSON
# index, archetypes, and build-time validation.
#
# The Library is ONE unified catalog of entries, not a set of sections. An
# entry's `library.type` and `subjects` are metadata and filters — never
# separate content shelves. Ordered lists (not maps) so templates iterate in
# display order and each entry carries its own key.

# Primary entry type (one per entry, nested as `library.type`) — the SPECIFIC
# type: what form the thing takes (book, essay, album, composition, …).
# `public_type` keys into `public_types` below — the eight broad ontological
# classes used for navigation and visual identity (see CLAUDE.md § Library
# "Public Type vs Specific Type"). Every specific type must map to exactly one
# public type; validation fails the build on anything unmapped. Presentation
# adapts to the specific type; there is no public section per type.
#
# `system` is NOT a subtype of `work` — see CLAUDE.md § Library "Systems
# Ontology": a synthesizer, programming language, modular panel, software
# environment, or hardware module is the thing creation happens *through*,
# not a created work in itself. instrument/module/software/hardware/language/
# interface/method/technique are system SUBTYPES (descriptive metadata, same
# as any other specific type); `system` itself is also a specific type — the
# generic case when no finer subtype applies (e.g. a whole platform), exactly
# how `person`/`group`/`organization` each map 1:1 to their own public type.
types:
  - {type: person,       label: "Person",          order: 15,  public_type: person}
  - {type: group,        label: "Group",           order: 18,  public_type: group}
  - {type: organization, label: "Organization",    order: 20,  public_type: organization}
  - {type: book,         label: "Book",            order: 30,  public_type: work}
  - {type: essay,        label: "Essay",           order: 40,  public_type: work}
  - {type: story,        label: "Story",           order: 45,  public_type: work}
  - {type: paper,        label: "Paper",           order: 50,  public_type: work}
  - {type: article,      label: "Article",         order: 60,  public_type: work}
  - {type: manual,       label: "Manual",          order: 70,  public_type: work}
  - {type: recording,    label: "Recording",       order: 80,  public_type: work}
  - {type: album,        label: "Album",           order: 90,  public_type: work}
  - {type: composition,  label: "Composition",     order: 100, public_type: work}
  - {type: installation, label: "Installation",    order: 105, public_type: work}
  - {type: film,         label: "Film",            order: 110, public_type: work}
  - {type: video,        label: "Video",           order: 120, public_type: work}
  - {type: lecture,      label: "Lecture",         order: 130, public_type: work}
  - {type: audio,        label: "Audio",           order: 140, public_type: work}
  - {type: podcast,      label: "Podcast",         order: 150, public_type: work}
  - {type: website,      label: "Website",         order: 160, public_type: work}
  - {type: archive,      label: "Archive",         order: 170, public_type: work}
  - {type: repository,   label: "Code Repository", order: 190, public_type: work}
  - {type: project,      label: "Project",         order: 200, public_type: work}
  - {type: document,     label: "Document",        order: 230, public_type: work}
  - {type: other,        label: "Other",           order: 240, public_type: work}
  - {type: event,        label: "Event",           order: 250, public_type: event}
  - {type: place,        label: "Place",           order: 260, public_type: place}
  - {type: concept,      label: "Concept",         order: 270, public_type: concept}
  - {type: instrument,   label: "Instrument",      order: 310, public_type: system}
  - {type: module,       label: "Module",          order: 320, public_type: system}
  - {type: software,     label: "Software",        order: 330, public_type: system}
  - {type: hardware,     label: "Hardware",        order: 340, public_type: system}
  - {type: language,     label: "Language",        order: 350, public_type: system}
  - {type: interface,    label: "Interface",       order: 360, public_type: system}
  - {type: method,       label: "Method",          order: 370, public_type: system}
  - {type: technique,    label: "Technique",       order: 380, public_type: system}
  - {type: protocol,     label: "Protocol",        order: 390, public_type: system}
  - {type: system,       label: "System",          order: 400, public_type: system}

# The eight public types — canonical visual identity (Map nodes, Type filter
# chip markers, image-node borders, future legends/badges) AND primary
# filtering. One centralized mapping, defined here once, resolved by the
# shared partials/library-public-types.html and consumed by
# layouts/library/list.json (exports `public_type` per entry + the
# `public_type_styles` dict), library-filters.html (chip swatches), and
# assets/js/library-map.js (node fill/shape) — none of them hard-codes a
# colour or duplicates this mapping. `color` is always a data/colorplan.json
# slug (resolved as var(--colorplan-<slug>)); shapes repeat across types by
# design (color is the primary distinguisher, shape reinforces) — see
# CLAUDE.md § Library "Public Type vs Specific Type". Deliberately avoids
# forest/slate/cobalt/bitter-chocolate, already meaningful elsewhere (Library
# section, Journal section, SARC-100 project, site default).
public_types:
  - {public_type: person,       label: "Person",       order: 10, color: bagdad-brown, shape: circle}
  - {public_type: group,        label: "Group",        order: 20, color: claret,       shape: diamond}
  - {public_type: organization, label: "Organization", order: 30, color: dark-grey,     shape: square}
  - {public_type: work,         label: "Work",         order: 40, color: sapphire,     shape: circle}
  - {public_type: system,       label: "System",       order: 45, color: rust,         shape: square}
  - {public_type: event,        label: "Event",        order: 50, color: emerald,      shape: triangle}
  - {public_type: place,        label: "Place",        order: 60, color: amethyst,     shape: square}
  - {public_type: concept,      label: "Concept",      order: 70, color: purple,       shape: diamond}

# Controlled subjects (multiple per entry) — why an entry matters to SARC, not a
# commercial genre. Keep small. `time` is deliberately broad (chronology,
# duration, rhythm, recurrence, cycles, temporal scale, memory, simultaneity,
# historical time, time-series behaviour), NOT the narrow `chronology`.
subjects:
  - {subject: time,              label: "Time"}
  - {subject: number,            label: "Number"}
  - {subject: form,              label: "Form"}
  - {subject: morphogenesis,     label: "Morphogenesis"}
  - {subject: dynamics,          label: "Dynamics"}
  - {subject: cybernetics,       label: "Cybernetics"}
  - {subject: computation,       label: "Computation"}
  - {subject: perception,        label: "Perception"}
  - {subject: sound,             label: "Sound"}
  - {subject: tuning,            label: "Tuning"}
  - {subject: instruments,       label: "Instruments"}
  - {subject: space,             label: "Space"}
  - {subject: memory,            label: "Memory"}
  - {subject: feedback,          label: "Feedback"}
  - {subject: language,          label: "Language"}

# Controlled creator roles (`creators[].role`). A creator always has a `name`; an
# optional `ref` (another entry's library.id) links the name and generates the
# reverse "works" relationship on that entry. Who designed/developed/
# manufactured a System entry (e.g. Wolfgang Palm designing the PPG Wave 2,
# PPG manufacturing it) is a `creators[].role` (designer/developer/
# manufacturer) exactly like any other credit — see CLAUDE.md § Library
# "Systems Ontology": never a `related` relation, per the rule directly above
# relation_types below.
creator_roles:
  - author
  - artist
  - composer
  - performer
  - director
  - founder
  - lecturer
  - editor
  - researcher
  - designer
  - developer
  - manufacturer
  - organization
  - label
  - publisher

# Controlled editorial relationship types (`related[].relation`). Creator
# attribution uses `creators`, never `related` — so there is deliberately no
# designed-by/manufactured-by/developed-by here (see creator_roles above).
# `part-of` is also how System hierarchy nests (a module part-of a panel,
# a panel part-of a synthesizer) — see CLAUDE.md § Library "Systems
# Ontology": no separate "Panel" type, no separate containment relation,
# hierarchy is just `part-of` declared arbitrarily deep. Its inverse label
# is resolved contextually (library-related.html): "Contains" when the
# entry declaring it is public_type `system`, "Member" otherwise (unchanged
# for person/group-in-organization).
relation_types:
  - related-work
  - version-of
  - edition-of
  - release-of
  - recording-of
  - performance-of
  - discusses
  - influenced-by
  - related-reading
  - documents
  - used-by
  - part-of
  - successor-to
  - predecessor-to
  - implements
  - programmed-in
  - compatible-with
  # A Work declares made-with pointing at the System (instrument/software/
  # hardware) it was created with — e.g. Riddles of the Sphinx made-with
  # EMS Synthi AKS. Reads "Made With" on the Work, "Used In" (its inverse,
  # below) on the System. Only declare this where a specific, named system is
  # actually documented (an interview, liner notes, gear-history writeup) —
  # never inferred from genre or period.
  - made-with
  # Studios/institutions branch (see CLAUDE.md § Library "Institutions and
  # Studios"). Founding and directing a specific person did is a creators
  # role (founder/director, above) exactly like designer/developer/
  # manufacturer on a System — never a related relation. These four cover
  # what's left: an Organization sited at a Place (GRM based-at GRM
  # Studios); a Work commissioned by an Organization or Person (distinct
  # from creators, who actually made it); a loose Person-to-Organization/
  # Place tie where "creator" doesn't fit (staff, resident, associate —
  # collapses the spec's "worked at"/"associated with"); and a Work's
  # creation site (collapses "recorded at"/"composed at"/"produced at" —
  # one relation, the prose can carry the distinction).
  - based-at
  - commissioned-by
  - affiliated-with
  - created-at
  # A documented, ongoing artistic partnership between two people (or
  # groups) — distinct from affiliated-with (a Person-to-Organization/Place
  # tie) and from the graph's existing work-mediated connections (two
  # creators sharing credit on one entry already link through that work).
  # collaborator-of is for a relationship that's real independent of any
  # single shared work — e.g. David Tudor as John Cage's essential
  # long-term performer, or Cage and Morton Feldman as close artistic
  # partners in the New York School — not a substitute for creators, and
  # never inferred from merely sharing an organization or subject. Symmetric
  # (its own inverse), like compatible-with.
  - collaborator-of

# Inverse labels for reverse-resolved `related` links. `related` is bidirectional:
# a relation declared on one entry also renders on its target, labelled by the
# inverse here (e.g. a composer's `part-of GRM` shows as "Member" on GRM). Display
# only — never stored or validated. Symmetric relations map to themselves.
relation_inverse:
  related-work: related-work
  related-reading: related-reading
  influenced-by: influenced
  documents: documented-by
  discusses: discussed-by
  used-by: uses
  part-of: member
  version-of: has-version
  edition-of: has-edition
  release-of: released-as
  recording-of: recorded-as
  performance-of: performed-as
  successor-to: predecessor-to
  predecessor-to: successor-to
  implements: implemented-by
  programmed-in: implementation-language-of
  compatible-with: compatible-with
  made-with: used-in
  based-at: hosts
  commissioned-by: commissioned
  affiliated-with: affiliated-with
  created-at: creation-site
  collaborator-of: collaborator-of

# Access kinds (`access[].kind`). `url` and `file` are mutually exclusive per
# item; `hosted-file` requires a bundle-relative `file` (and is the only kind
# that makes SARC a host — it drives the rights guard). `verb` is a fallback
# label; `external` kinds open in a new tab with ↗.
access_kinds:
  - {kind: publisher,      verb: "Publisher / purchase",  external: true}
  - {kind: purchase,       verb: "Purchase",              external: true}
  - {kind: bandcamp,       verb: "Bandcamp",              external: true}
  - {kind: video,          verb: "Watch",                 external: true}
  - {kind: audio,          verb: "Listen",                external: true}
  - {kind: stream,         verb: "Stream",                external: true}
  - {kind: website,        verb: "Visit website",         external: true}
  - {kind: external-copy,  verb: "Read externally",       external: true}
  - {kind: repository,     verb: "View repository",       external: true}
  - {kind: archive,        verb: "Archive",               external: true}
  - {kind: catalog-record, verb: "Catalog record",        external: true}
  - {kind: worldcat,       verb: "WorldCat",              external: true}
  - {kind: discogs,        verb: "Discogs",               external: true}
  - {kind: other,          verb: "Link",                  external: true}
  - {kind: hosted-file,    verb: "Download",              external: false}

# Per-image fields and the distinction between them (see CLAUDE.md § Library
# for full examples): `credit` names who actually made or legitimately supplies
# the image (a photographer, designer, archive, estate, or "SARC"). `source`
# is the exact page where the image was obtained or its provenance can be
# verified (an official/archive/publisher/label page, a Wikimedia Commons file
# page, an exact Bandcamp/Discogs/Goodreads record — not a homepage or a raw
# CDN URL when a contextual page exists). A platform name (Bandcamp, Discogs,
# Wikipedia, Spotify, Google, …) is almost always a `source` domain, not a
# `credit` — leave `credit` absent rather than naming the site you found it on.

# Descriptive image roles (not strictly validated — metadata only).
image_roles:
  - cover
  - back-cover
  - portrait
  - still
  - diagram
  - installation
  - detail
  - label
  - insert
  - packaging
  - screenshot
  - document

# Rights statuses for hosted third-party files. See CLAUDE.md § Library.
# `review` (or unset) keeps a hosted file a draft — the build fails if an entry
# with a `hosted-file` access publishes without a publishable status.
# `external-link-only` is for entries that only link out (host nothing).
# `archival` is a deliberate, takedown-on-request status for a long-discontinued
# product's documentation.
rights_status: [sarc-owned, public-domain, licensed, permitted, review, external-link-only, archival]
rights_hosted_ok: [sarc-owned, public-domain, licensed, permitted, archival]

# Per-image rights vocabulary (`images[].rights.status`) — a separate, smaller
# vocabulary from `rights_status` above. That one gates whether SARC may host a
# *file* (a document); this one records what's actually known about a
# *picture*'s copyright status, and never gates anything on its own. `unknown`
# is the honest default — not a stand-in for clearance — and applies to most
# images in the catalog: an official cover or press photo is still `unknown`
# unless SARC actually holds a license or the work is genuinely public domain.
# Don't put a *rationale for use* here (see `image_use_basis` below) — status
# describes the copyright condition only.
image_rights_status: [sarc-owned, public-domain, licensed, permitted, unknown]

# Per-image use rationale (`images[].use.basis`) — separate from rights.status
# above. Rights records what's known about copyright; `use.basis` records why
# SARC is using the image anyway when status isn't sarc-owned/public-domain/
# licensed/permitted — e.g. official cover art shown for identification, or a
# manual diagram kept for archival documentation of discontinued hardware.
# This is an editorial rationale, not a legal determination, and never changes
# rights.status. Pair `use.basis` with a `use.note` giving the specifics.
image_use_basis: [identification, editorial, promotional, fair-use, archival]
