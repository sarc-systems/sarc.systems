# Library vocabulary — single source of truth for templates, filters, the JSON
# index, archetypes, and build-time validation.
#
# The Library is ONE unified catalog of entries, not a set of sections. An
# entry's `library.type` and `subjects` are metadata and filters — never
# separate content shelves. Ordered lists (not maps) so templates iterate in
# display order and each entry carries its own key.

# Primary entry type (one per entry, nested as `library.type`). Presentation
# adapts to the type; there is no public section per type. `category` keys
# into `type_categories` below (the shared type-color/shape system) — several
# types deliberately share one category/token; see the comment there for why.
types:
  - {type: person,       label: "Person",         order: 15,  category: people}
  - {type: group,        label: "Group",          order: 18,  category: people}
  - {type: organization, label: "Organization",   order: 20,  category: people}
  - {type: book,         label: "Book",           order: 30,  category: written}
  - {type: essay,        label: "Essay",          order: 40,  category: written}
  - {type: story,        label: "Story",          order: 45,  category: written}
  - {type: paper,        label: "Paper",          order: 50,  category: written}
  - {type: article,      label: "Article",        order: 60,  category: written}
  - {type: manual,       label: "Manual",         order: 70,  category: written}
  - {type: recording,    label: "Recording",      order: 80,  category: audiovisual}
  - {type: release,      label: "Release",        order: 90,  category: audiovisual}
  - {type: composition,  label: "Composition",    order: 100, category: audiovisual}
  - {type: film,         label: "Film",           order: 110, category: audiovisual}
  - {type: video,        label: "Video",          order: 120, category: audiovisual}
  - {type: lecture,      label: "Lecture",        order: 130, category: audiovisual}
  - {type: audio,        label: "Audio",          order: 140, category: audiovisual}
  - {type: podcast,      label: "Podcast",        order: 150, category: audiovisual}
  - {type: website,      label: "Website",        order: 160, category: web}
  - {type: archive,      label: "Archive",        order: 170, category: web}
  - {type: software,     label: "Software",       order: 180, category: technical}
  - {type: repository,   label: "Code Repository", order: 190, category: technical}
  - {type: project,      label: "Project",        order: 200, category: technical}
  - {type: instrument,   label: "Instrument",     order: 210, category: technical}
  - {type: system,       label: "System",         order: 220, category: technical}
  - {type: document,     label: "Document",       order: 230, category: written}
  - {type: other,        label: "Other",          order: 240, category: other}

# Shared type-color/shape system (Map nodes + Type filter chip markers — see
# CLAUDE.md § Library map view "Node Type Encoding"). One canonical map,
# defined here once and consumed by both layouts/partials/library-filters.html
# (chip swatches) and assets/js/library-map.js (node fill/shape) via
# list.json's exported `type_styles` — neither hard-codes a colour.
#
# 25+ individual types share this small handful of categories rather than each
# getting a bespoke hue: a "restrained institutional palette" (per spec) means
# a few legible, muted distinctions, not a rainbow no one can hold in their
# head. `color` is a data/colorplan.json slug (resolved as
# var(--colorplan-<slug>), never a hand-picked hex — Colorplan is this site's
# only colour source, full stop). Deliberately avoids forest/slate/cobalt/
# bitter-chocolate, already meaningful elsewhere (Library section, Journal
# section, SARC-100 project, site default).
type_categories:
  - {category: people,      label: "People & groups",       color: bagdad-brown, shape: circle}
  - {category: written,     label: "Written works",         color: sapphire,     shape: square}
  - {category: audiovisual, label: "Audio & visual works",  color: claret,       shape: circle}
  - {category: technical,   label: "Technical & systems",   color: emerald,      shape: diamond}
  - {category: web,         label: "Web & reference",       color: amethyst,     shape: triangle}
  - {category: other,       label: "Other",                 color: dark-grey,    shape: circle}

# Controlled subjects (multiple per entry) — why an entry matters to SARC, not a
# commercial genre. Keep small. `time` is deliberately broad (chronology,
# duration, rhythm, recurrence, cycles, temporal scale, memory, simultaneity,
# historical time, time-series behaviour), NOT the narrow `chronology`.
subjects:
  - {subject: time,              label: "Time"}
  - {subject: number,            label: "Number"}
  - {subject: form,              label: "Form"}
  - {subject: morphogenesis,     label: "Morphogenesis"}
  - {subject: dynamical-systems, label: "Dynamical Systems"}
  - {subject: cybernetics,       label: "Cybernetics"}
  - {subject: computation,       label: "Computation"}
  - {subject: perception,        label: "Perception"}
  - {subject: sound,             label: "Sound"}
  - {subject: tuning,            label: "Tuning"}
  - {subject: instruments,       label: "Instruments"}
  - {subject: technology,        label: "Technology"}
  - {subject: space,             label: "Space"}
  - {subject: memory,            label: "Memory"}
  - {subject: feedback,          label: "Feedback"}
  - {subject: language,          label: "Language"}

# Controlled creator roles (`creators[].role`). A creator always has a `name`; an
# optional `ref` (another entry's library.id) links the name and generates the
# reverse "works" relationship on that entry.
creator_roles:
  - author
  - artist
  - composer
  - performer
  - director
  - lecturer
  - editor
  - researcher
  - developer
  - manufacturer
  - organization
  - label
  - publisher

# Controlled editorial relationship types (`related[].relation`). Creator
# attribution uses `creators`, never `related`.
relation_types:
  - related-work
  - version-of
  - edition-of
  - release-of
  - recording-of
  - performance-of
  - discusses
  - influenced-by
  - related-reading
  - documents
  - used-by
  - part-of
  - successor-to
  - predecessor-to

# Inverse labels for reverse-resolved `related` links. `related` is bidirectional:
# a relation declared on one entry also renders on its target, labelled by the
# inverse here (e.g. a composer's `part-of GRM` shows as "Member" on GRM). Display
# only — never stored or validated. Symmetric relations map to themselves.
relation_inverse:
  related-work: related-work
  related-reading: related-reading
  influenced-by: influenced
  documents: documented-by
  discusses: discussed-by
  used-by: uses
  part-of: member
  version-of: has-version
  edition-of: has-edition
  release-of: released-as
  recording-of: recorded-as
  performance-of: performed-as
  successor-to: predecessor-to
  predecessor-to: successor-to

# Access kinds (`access[].kind`). `url` and `file` are mutually exclusive per
# item; `hosted-file` requires a bundle-relative `file` (and is the only kind
# that makes SARC a host — it drives the rights guard). `verb` is a fallback
# label; `external` kinds open in a new tab with ↗.
access_kinds:
  - {kind: publisher,      verb: "Publisher / purchase",  external: true}
  - {kind: purchase,       verb: "Purchase",              external: true}
  - {kind: bandcamp,       verb: "Bandcamp",              external: true}
  - {kind: video,          verb: "Watch",                 external: true}
  - {kind: audio,          verb: "Listen",                external: true}
  - {kind: stream,         verb: "Stream",                external: true}
  - {kind: website,        verb: "Visit website",         external: true}
  - {kind: external-copy,  verb: "Read externally",       external: true}
  - {kind: repository,     verb: "View repository",       external: true}
  - {kind: archive,        verb: "Archive",               external: true}
  - {kind: catalog-record, verb: "Catalog record",        external: true}
  - {kind: worldcat,       verb: "WorldCat",              external: true}
  - {kind: discogs,        verb: "Discogs",               external: true}
  - {kind: other,          verb: "Link",                  external: true}
  - {kind: hosted-file,    verb: "Download",              external: false}

# Per-image fields and the distinction between them (see CLAUDE.md § Library
# for full examples): `credit` names who actually made or legitimately supplies
# the image (a photographer, designer, archive, estate, or "SARC"). `source`
# is the exact page where the image was obtained or its provenance can be
# verified (an official/archive/publisher/label page, a Wikimedia Commons file
# page, an exact Bandcamp/Discogs/Goodreads record — not a homepage or a raw
# CDN URL when a contextual page exists). A platform name (Bandcamp, Discogs,
# Wikipedia, Spotify, Google, …) is almost always a `source` domain, not a
# `credit` — leave `credit` absent rather than naming the site you found it on.

# Descriptive image roles (not strictly validated — metadata only).
image_roles:
  - cover
  - back-cover
  - portrait
  - still
  - diagram
  - installation
  - detail
  - label
  - insert
  - packaging
  - screenshot
  - document

# Rights statuses for hosted third-party files. See CLAUDE.md § Library.
# `review` (or unset) keeps a hosted file a draft — the build fails if an entry
# with a `hosted-file` access publishes without a publishable status.
# `external-link-only` is for entries that only link out (host nothing).
# `archival` is a deliberate, takedown-on-request status for a long-discontinued
# product's documentation.
rights_status: [sarc-owned, public-domain, licensed, permitted, review, external-link-only, archival]
rights_hosted_ok: [sarc-owned, public-domain, licensed, permitted, archival]

# Per-image rights vocabulary (`images[].rights.status`) — a separate, smaller
# vocabulary from `rights_status` above. That one gates whether SARC may host a
# *file* (a document); this one records what's actually known about a
# *picture*'s copyright status, and never gates anything on its own. `unknown`
# is the honest default — not a stand-in for clearance — and applies to most
# images in the catalog: an official cover or press photo is still `unknown`
# unless SARC actually holds a license or the work is genuinely public domain.
# Don't put a *rationale for use* here (see `image_use_basis` below) — status
# describes the copyright condition only.
image_rights_status: [sarc-owned, public-domain, licensed, permitted, unknown]

# Per-image use rationale (`images[].use.basis`) — separate from rights.status
# above. Rights records what's known about copyright; `use.basis` records why
# SARC is using the image anyway when status isn't sarc-owned/public-domain/
# licensed/permitted — e.g. official cover art shown for identification, or a
# manual diagram kept for archival documentation of discontinued hardware.
# This is an editorial rationale, not a legal determination, and never changes
# rights.status. Pair `use.basis` with a `use.note` giving the specifics.
image_use_basis: [identification, editorial, promotional, fair-use, archival]
