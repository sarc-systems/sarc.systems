# Library structure and vocabularies (single source of truth for templates).
# `type` is the value pages carry in front matter as `library.type`; `slug` is
# the category's URL segment and landing-page anchor. Order = display order.
categories:
  - type: writing
    slug: writings
    title: Writings
    description: "Finished, durable texts written by SARC — essays, papers, reports, and statements. Rendered HTML-first; a PDF edition may be offered alongside."
  - type: manual
    slug: manuals
    title: Manuals
    description: "How instruments, circuits, devices, and software work — SARC and third-party documentation, hosted, linked, or listed as a record."
  - type: source
    slug: sources
    title: Sources
    description: "Third-party texts SARC makes available for study. Every hosted source carries explicit rights and provenance."
  - type: reading
    slug: reading
    title: Reading
    description: "Books, papers, and essays recommended by SARC but hosted elsewhere. The annotation explains why the work matters."
  - type: link
    slug: links
    title: Links
    description: "Annotated paths outward — artists, archives, research projects, software, lectures, and channels."

# Allowed vocabularies. Templates validate against these and fail the build on
# invalid values (see partials/library-validate.html).
allowed_types: [writing, manual, source, reading, link]
availability: [hosted, external, bibliographic]
# Rights statuses that permit a hosted third-party file to publish. `review`
# (and unset) do not — such items must stay drafts.
rights_status: [sarc-owned, public-domain, licensed, permitted, review]
rights_hosted_ok: [sarc-owned, public-domain, licensed, permitted]
