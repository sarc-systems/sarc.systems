# Homepage editorial quotes — see CLAUDE.md § Homepage quote and
# layouts/partials/homepage-quote.html. This is homepage editorial content,
# not part of the Library: quotes are never Library entries, never stored in
# Library front matter, and never affect Library filters/counts/JSON/random
# selection. `library_ref` is an optional, one-way pointer INTO the Library
# (validated to resolve — see homepage-quotes-validate.html) — it does not
# make the quote part of the catalog.
#
# Fields: id (required, unique, stable, kebab-case — session storage and the
# client script key on this, never on array position or on `text`), text
# (required), author (required), work (optional), year (optional), citation
# (required — an editorial verification note for maintainers, not shown on
# the page), source_url (optional, the exact source page — never a bare
# homepage or search result), library_ref (optional, another entry's
# library.id), enabled (optional, default true).
#
# Quality over quantity: a small, carefully verified set. Wording believed
# accurate for all of these; exact original page/edition citations are
# intentionally left as open editorial notes below rather than guessed.

