# Colorplan palette assignments (central — never hardcode colours in templates).
# Values are Colorplan slugs from data/colorplan.json. Only paper-legible
# (dark) colours belong here, since section colours are used as text/accents on
# the warm-white background. Resolution order (see partials/palette-vars.html):
#   1. page front-matter `palette.primary`
#   2. project (first match below)
#   3. section
#   4. default (neutral SARC house colour)

# Neutral SARC default — a near-neutral warm dark. Keeps the base monochrome.
default: bitter-chocolate

# Institutional section colours (coded signals, not colour fields).
sections:
  journal: slate
  library: forest
  # Future departments (assigned when they launch):
  # systems: cobalt        # hardware/software dev; home of the SARC-100
  # studio: bagdad-brown
  # label: vermillion

# Project colours. A project keeps its identity across entry types. SARC-100 is
# a system within the Systems department, but stays its own project for colour.
projects:
  sarc-100: cobalt

# Page-background wash per section — deliberately SEPARATE from `sections`
# above. `sections` (slate/forest) still drives nav/rules/links/index markers/
# Map colour; these two exist only for the large low-opacity body background
# in layout.css (body.journal/body.library). Slate and forest are both cool,
# dark accent colours — fine as small accents, but mixed faintly across a
# whole page they read as a flat, slightly muddy grey that clashes with the
# SARC Eternal Clock's randomized header/footer colour (assets/js/
# clock-config.js — the header/footer can land on almost any of the 55
# Colorplan colours at any time). China White and Powder Green are pale,
# warm-leaning Colorplan paper tones close in lightness to the site's own
# warm-white --paper, so they read as "a different stock of paper" rather
# than a saturated colour field, and stay legible regardless of header
# colour, while remaining clearly distinct from each other.
backgrounds:
  journal: china-white
  library: powder-green
