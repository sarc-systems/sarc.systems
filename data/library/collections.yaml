# Library v2 Collection registry — see docs/library-v2.md § 3.
#
# Binding: this file's path (data/library/collections.yaml) plus its
# root-level LIST shape (not a `collections:`-keyed map) is what makes Hugo
# expose it as `hugo.Data.library.collections` — a plain slice, one item per
# Collection. (Hugo's data tree mirrors the data/ directory structure:
# data/library.yaml supplies the map at hugo.Data.library; this file, one
# level down, supplies the same map's "collections" key.)
#
# `color` must be an existing data/colorplan.json `colors[].slug` — build
# fails otherwise (library-validate.html). Never a raw hex value.
#
# `source.section` is the content-relative directory (under content/) this
# Collection's Hugo-adapter Entries live under — see docs/library-v2.md
# § 2.2/§ 13.
#
# `related` — explicit, editorially-authored Collection-to-Collection
# relationships, rendered on the root Map (docs/library-v2.md § 11).
# {ref, relation} exactly like an Entry's own `related` field; `relation`
# must be one of data/library.yaml's relation_types. Automatic derivation
# from lower-level cross-Collection Entry references is explicitly
# deferred — see docs/library-v2.md § 12.3/§ 15.
- id: research
  title: SARC Research
  description: >
    Historical, conceptual, technical, and artistic references surrounding SARC.
  color: forest
  source:
    adapter: hugo
    section: library/research
  views:
    enabled: [catalog, images, map]
    default: map
  # Every Collection has an implicit `all` Projection (identity transform,
  # no context Entries added) even if not listed here — see
  # docs/library-v2.md § 6.2. `default` names which Projection loads with
  # no `?projection=` in the URL. Listing `all` explicitly here (rather
  # than leaving it purely implicit) is what lets the config validation and
  # the client-side Projection/View compatibility resolver
  # (assets/js/library-filter.js) treat every Collection uniformly, with
  # no special-cased "there's no explicit list" branch.
  projections:
    default: all
    list:
      - id: all
        title: All Entries
        views: [catalog, images, map]
        default_view: catalog
  build:
    production: true
  related: []
