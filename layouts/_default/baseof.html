<!doctype html>
<html lang="{{ or site.Language.Locale "en" }}" data-nojs>
<head>
  {{ partial "head.html" . }}
</head>
{{- $palette := partial "palette-vars.html" . -}}
<body class="{{ block "body-class" . }}{{ end }}"{{ with $palette }} style="{{ . | safeCSS }}"{{ end }}>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
