<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SARC">
  <rect width="32" height="32" fill="#0d0d0c"/>
  <!-- Four-row mark, abstracted: two bright rows, two dim reflections. -->
  <g fill="#f2eede">
    <rect x="6" y="6"  width="20" height="4"/>
    <rect x="6" y="12" width="20" height="4"/>
  </g>
  <g fill="#f2eede" opacity="0.42">
    <rect x="6" y="18" width="20" height="4"/>
    <rect x="6" y="24" width="20" height="4"/>
  </g>
</svg>
