    proposal_type: edit_body
    current_value: "\"Renamed from the R.A. Moog Company in 1971, Moog Music built...\""
    proposed_value: "Correct to reflect the two-step rename: R.A. Moog Company → Moog Musonics (1971, following muSonics' acquisition) → Moog Music, Inc. (1972)."
    evidence_class: probable
    reason: "Two secondary sources agree on the two-step timeline and the 1972 date for the 'Moog Music' name specifically, contradicting the entry's current single-step 1971 claim. Specific enough (an exact corporate rename year) to want a primary/trade-press source before treating as fully verified."
